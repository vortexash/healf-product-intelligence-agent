# Render blueprint for the FastAPI backend (monorepo: backend lives in ./backend).
# In the Render dashboard: New + > Blueprint > point at this repo.
# Then set the secret env var OPENAI_API_KEY (and, optionally, FRONTEND_ORIGIN = your Vercel URL).
services:
  - type: web
    name: healf-backend
    runtime: docker
    # Paths are relative to the REPO ROOT. Point both the Dockerfile and its
    # build context at ./backend so the COPY steps inside the Dockerfile resolve.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_API_KEY
        sync: false            # set this in the dashboard (never in the repo)
      - key: FRONTEND_ORIGIN
        value: "*"             # tighten to your Vercel URL after the frontend deploys
      - key: HTTP_USER_AGENT
        value: HealfProductIntelligenceMVP/1.0
