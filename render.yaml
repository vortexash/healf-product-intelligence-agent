# Render blueprint for the FastAPI backend.
# In the Render dashboard: New + > Blueprint > point at this repo.
# Then set the secret env var OPENAI_API_KEY (and update FRONTEND_ORIGIN to your Vercel URL).
services:
  - type: web
    name: healf-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_API_KEY
        sync: false            # set this in the dashboard (never in the repo)
      - key: FRONTEND_ORIGIN
        value: "*"             # tighten to your Vercel URL after the frontend deploys
      - key: HTTP_USER_AGENT
        value: HealfProductIntelligenceMVP/1.0
