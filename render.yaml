# Render blueprint for the FastAPI backend (monorepo: backend lives in ./backend).
# Uses Render's NATIVE PYTHON runtime (not Docker) - simplest + most reliable for a
# monorepo: rootDir points at ./backend so requirements.txt and app/ resolve directly.
# In the dashboard: New + > Blueprint > this repo, then set the secret OPENAI_API_KEY.
services:
  - type: web
    name: healf-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_API_KEY
        sync: false            # set this in the dashboard (never in the repo)
      - key: FRONTEND_ORIGIN
        value: "*"             # tighten to your Vercel URL after the frontend deploys
      - key: HTTP_USER_AGENT
        value: HealfProductIntelligenceMVP/1.0
